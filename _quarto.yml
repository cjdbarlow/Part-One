# Global settings
project:
  type: book
  execute-dir: project
  pre-render: scripts/drugbase.R
  resources:
    - themes/images/litfl-logo.jpg
execute:
  # These options are set to manage the autogenerated tables in the pharmacopeia, which is the only time these are used.
  echo: false
  warning: false
  message: false
  output: "asis"
## Filters shared by all output formats
filters:
  - scripts/html-only-pages.lua
  - scripts/drug-tables.lua
## Settings for caching to reduce compile times
#  freeze: auto
#  cache: true
## Allow subparts in the yaml
validate-yaml: false



# Settings for output formats
format:
  html:
    # General settings
    page-navigation: false
    search: true
    section-divs: true
    email-obfuscation: javascript
    lang: en-GB
    date-modified:
      value: last-modified
      format: "DD/MM/YYYY"
    # Theming
    theme: themes/titfl.scss
    css: themes/custom.css
    include-before-body: themes/litfl.html
    cap-location: margin
    citation-location: margin
    reference-location: document
    number-sections: false
    # Style
    toc: true
    toc-title: "On this Page"
    tbl-cap-location: top
    fig-align: center
    fig-format: svg
    fig-dpi: 326
    fig-responsive: true
    filters: [scripts/glossary.lua, scripts/html-tables.lua, scripts/timestamp.lua]
  pdf:
    # General Settings
    title: "Part One"
    subtitle: |
      A Pretty Good Guide\
      to the Primary Exam
    author: "C. Jake Barlow"
    publishers: "Life in the Fast Lane"
    template-partials: [themes/title.tex]
    keep-tex: true
    # Theming
    documentclass: scrbook
    classoption: [oneside, open=any]
    filters:
      - path: scripts/pdf-media-shortcodes.lua
        at: pre-ast
      - path: scripts/pdf-raw-images.lua
        at: pre-ast
      - scripts/pdf-images.lua
      - scripts/boxes.lua
      - scripts/tables.lua
    use-rsvg-convert: true
    include-in-header: [themes/titfl.tex]
    cap-location: margin
    citation-location: margin
    reference-location: document
    number-sections: false
    # Style
    toc-title: "Contents"
    tbl-cap-location: top
    include-before-body: content/copyright.tex

crossref:
    appendix-delim: "."
    appendix-title: ""

