<style id="litfl-header-styles">
  .ct-header,
  .ct-header * {
    box-sizing: border-box;
  }

  .ct-header {
    --litfl-ink: #263f58;
    --litfl-accent: #c94343;
    --litfl-focus: #0067a8;
    --litfl-rule: #e8edf1;
    --litfl-muted: #667888;
    position: relative;
    z-index: 1020;
    width: 100%;
    overflow-x: clip;
    overflow-y: visible;
    background: #fff;
    color: var(--litfl-ink);
    font-family: Arial, Helvetica, sans-serif;
  }

  .ct-header a {
    color: inherit;
    text-decoration: none;
  }

  .ct-header a:focus-visible,
  .ct-header button:focus-visible,
  .ct-header input:focus-visible,
  .ct-header summary:focus-visible {
    outline: 3px solid var(--litfl-focus);
    outline-offset: 3px;
  }

  .ct-header ul {
    margin: 0;
    padding: 0;
    list-style: none;
  }

  .ct-header .litfl-visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  .ct-header .litfl-shell {
    width: min(calc(100% - 2rem), 1280px);
    margin-inline: auto;
  }

  .ct-header .litfl-brand-row {
    min-height: 94px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 2rem;
  }

  .ct-header .litfl-home-link {
    display: inline-flex;
    align-items: center;
    flex: 0 1 320px;
  }

  .ct-header .litfl-logo {
    display: block;
    width: min(100%, 320px);
    height: auto;
  }

  .ct-header .litfl-social-nav ul,
  .ct-header .litfl-mobile-social-nav ul {
    display: flex;
    align-items: center;
    gap: 0.8rem;
  }

  .ct-header .litfl-social-nav a,
  .ct-header .litfl-mobile-social-nav a {
    display: grid;
    width: 28px;
    height: 28px;
    place-items: center;
    border-radius: 50%;
    color: var(--litfl-ink);
    transition: color 140ms ease, background-color 140ms ease;
  }

  .ct-header .litfl-social-nav a:hover,
  .ct-header .litfl-mobile-social-nav a:hover {
    background: #f0f4f7;
    color: var(--litfl-accent);
  }

  .ct-header .litfl-social-nav svg,
  .ct-header .litfl-mobile-social-nav svg {
    width: 18px;
    height: 18px;
    fill: currentColor;
  }

  .ct-header .litfl-menu-toggle {
    display: none;
    width: 42px;
    height: 42px;
    padding: 9px;
    border: 0;
    border-radius: 4px;
    background: transparent;
    color: var(--litfl-ink);
    cursor: pointer;
  }

  .ct-header .litfl-menu-toggle-lines,
  .ct-header .litfl-menu-toggle-lines::before,
  .ct-header .litfl-menu-toggle-lines::after {
    display: block;
    width: 22px;
    height: 2px;
    border-radius: 2px;
    background: currentColor;
    content: "";
    transition: transform 160ms ease, opacity 160ms ease;
  }

  .ct-header .litfl-menu-toggle-lines {
    position: relative;
  }

  .ct-header .litfl-menu-toggle-lines::before {
    position: absolute;
    top: 0;
    left: 0;
    transform: translateY(-7px);
  }

  .ct-header .litfl-menu-toggle-lines::after {
    position: absolute;
    top: 0;
    left: 0;
    transform: translateY(7px);
  }

  .ct-header .litfl-menu-toggle[aria-expanded="true"] .litfl-menu-toggle-lines {
    background: transparent;
  }

  .ct-header .litfl-menu-toggle[aria-expanded="true"] .litfl-menu-toggle-lines::before {
    transform: rotate(45deg);
  }

  .ct-header .litfl-menu-toggle[aria-expanded="true"] .litfl-menu-toggle-lines::after {
    transform: rotate(-45deg);
  }

  .ct-header .litfl-menu-panel {
    border-block: 1px solid var(--litfl-rule);
    background: #fff;
  }

  .ct-header .litfl-menu-panel-inner {
    min-height: 48px;
    display: flex;
    align-items: stretch;
  }

  .ct-header .litfl-primary-nav {
    min-width: 0;
    flex: 1 1 auto;
  }

  .ct-header .litfl-primary-nav ul {
    height: 100%;
    display: flex;
    align-items: stretch;
    justify-content: space-between;
  }

  .ct-header .litfl-primary-nav li {
    display: flex;
  }

  .ct-header .litfl-primary-nav a {
    display: flex;
    align-items: center;
    padding: 0.9rem clamp(0.38rem, 0.75vw, 0.7rem);
    color: var(--litfl-ink);
    font-size: 0.74rem;
    font-weight: 700;
    letter-spacing: 0.045em;
    line-height: 1;
    text-transform: uppercase;
    white-space: nowrap;
    transition: color 140ms ease;
  }

  .ct-header .litfl-primary-nav a:hover,
  .ct-header .litfl-primary-nav a.is-active {
    color: var(--litfl-accent);
  }

  .ct-header .litfl-search {
    position: relative;
    flex: 0 0 auto;
    margin-left: 0.45rem;
  }

  .ct-header .litfl-search > summary {
    width: 46px;
    height: 100%;
    display: grid;
    place-items: center;
    color: var(--litfl-ink);
    cursor: pointer;
    list-style: none;
  }

  .ct-header .litfl-search > summary::-webkit-details-marker {
    display: none;
  }

  .ct-header .litfl-search > summary::marker {
    content: "";
  }

  .ct-header .litfl-search > summary:hover {
    color: var(--litfl-accent);
  }

  .ct-header .litfl-search-toggle svg,
  .ct-header .litfl-search-submit svg {
    width: 19px;
    height: 19px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
  }

  .ct-header .litfl-desktop-search {
    position: absolute;
    z-index: 3;
    top: calc(100% + 0.65rem);
    right: 0;
    width: min(330px, calc(100vw - 2rem));
    padding: 0.75rem;
    border: 1px solid var(--litfl-rule);
    border-radius: 4px;
    background: #fff;
    box-shadow: 0 12px 30px rgb(20 43 62 / 16%);
  }

  .ct-header .litfl-search-form {
    display: flex;
    align-items: stretch;
  }

  .ct-header .litfl-search-form input {
    min-width: 0;
    flex: 1 1 auto;
    padding: 0.68rem 0.75rem;
    border: 1px solid #cdd6dd;
    border-right: 0;
    border-radius: 3px 0 0 3px;
    background: #fff;
    color: #24394d;
    font: inherit;
  }

  .ct-header .litfl-search-submit {
    width: 43px;
    display: grid;
    flex: 0 0 43px;
    place-items: center;
    border: 1px solid var(--litfl-ink);
    border-radius: 0 3px 3px 0;
    background: var(--litfl-ink);
    color: #fff;
    cursor: pointer;
  }

  .ct-header .litfl-search-submit:hover {
    border-color: var(--litfl-accent);
    background: var(--litfl-accent);
  }

  .ct-header .litfl-mobile-search,
  .ct-header .litfl-mobile-social-nav {
    display: none;
  }

  body > .ct-header ~ #quarto-header {
    position: sticky;
    top: 0;
    right: auto;
    left: auto;
    width: 100%;
    transform: none !important;
    transition: none !important;
    will-change: auto;
  }

  body.litfl-header-present {
    padding-top: 0 !important;
  }

  @media (max-width: 1100px) {
    .ct-header .litfl-brand-row {
      min-height: 101px;
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr) 42px;
      gap: 0.5rem;
    }

    .ct-header .litfl-menu-toggle {
      display: grid;
      place-items: center;
      grid-column: 1;
    }

    .ct-header .litfl-home-link {
      width: 100%;
      display: flex;
      grid-column: 2;
      justify-content: center;
    }

    .ct-header .litfl-logo {
      width: min(100%, 280px);
    }

    .ct-header .litfl-social-nav {
      display: none;
    }

    .ct-header .litfl-menu-panel {
      display: none;
      border-bottom-width: 1px;
    }

    .ct-header .litfl-menu-panel.is-open {
      display: block;
    }

    .ct-header .litfl-menu-panel-inner {
      display: block;
      padding-block: 0.65rem 1.25rem;
    }

    .ct-header .litfl-primary-nav ul {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .ct-header .litfl-primary-nav li {
      display: block;
    }

    .ct-header .litfl-primary-nav a {
      min-height: 43px;
      padding: 0.75rem 0.7rem;
      border-bottom: 1px solid #eff2f4;
      font-size: 0.78rem;
    }

    .ct-header .litfl-search {
      display: none;
    }

    .ct-header .litfl-mobile-search {
      display: flex;
      margin-top: 1rem;
      padding-inline: 0.7rem;
    }

    .ct-header .litfl-mobile-social-nav {
      display: flex;
      justify-content: center;
      margin-top: 1rem;
    }
  }

  @media (max-width: 390px) {
    .ct-header .litfl-primary-nav ul {
      grid-template-columns: 1fr;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .ct-header *,
    .ct-header *::before,
    .ct-header *::after {
      scroll-behavior: auto !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>

<script>
  (() => {
    const script = document.currentScript;
    const header = script?.previousElementSibling;
    if (!header || header.dataset.litflReady === "true") return;

    const styles = document.querySelector("#litfl-header-styles");
    if (styles && styles.parentElement !== document.head) document.head.append(styles);
    document.body.classList.add("litfl-header-present");
    document.body.insertBefore(header, document.body.firstChild);

    header.dataset.litflReady = "true";
    const button = header.querySelector(".litfl-menu-toggle");
    const panel = header.querySelector("#litfl-menu-panel");

    const setMenuOpen = (open, restoreFocus = false) => {
      button.setAttribute("aria-expanded", String(open));
      button.setAttribute("aria-label", open ? "Close LITFL menu" : "Open LITFL menu");
      panel.classList.toggle("is-open", open);
      if (restoreFocus) button.focus();
    };

    button.addEventListener("click", () => {
      setMenuOpen(button.getAttribute("aria-expanded") !== "true");
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && button.getAttribute("aria-expanded") === "true") {
        setMenuOpen(false, true);
      }
    });

    document.addEventListener("click", (event) => {
      if (!header.contains(event.target) && button.getAttribute("aria-expanded") === "true") {
        setMenuOpen(false);
      }
    });

    const desktop = window.matchMedia("(min-width: 1101px)");
    desktop.addEventListener("change", (event) => {
      if (event.matches) setMenuOpen(false);
    });
  })();
</script>
